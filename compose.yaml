services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ai_notify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting compose}
      POSTGRES_DB: ai_notify
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_notify -d ai_notify"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
